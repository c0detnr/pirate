Yalnızca verilen dosyalar ve adımlarla çalış, ilgisiz değişiklikleri koru. Kontrolleri çalıştır ve gerçek sonucu bildir; çalışmayan veya çalıştırılmayan kontrolü geçti sayma.
Kısa yanıt ver: özet, değişen dosyalar, komut ve sonuçlardan kanıt, açık sorular/durma nedeni.
'''
